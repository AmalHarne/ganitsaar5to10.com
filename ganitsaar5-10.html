<style>
/* Layout: graph-paper page, one centered column; language switch in the header, teacher form above a list of class cards.
   Palette: paper, ink, ink-blue brand, marigold highlight, signal red for delete. */
:root {
  --bg: #f2f5f9;
  --grid: #dfe6ef;
  --surface: #ffffff;
  --fg: #16213a;
  --muted: #5b6780;
  --line: #d3dbe7;
  --brand: #234bb0;
  --brand-fg: #ffffff;
  --brand-soft: #e4ebfb;
  --mark: #f2a516;
  --mark-soft: #fff1d1;
  --danger: #b3261e;
  --font-display: "Tiro Devanagari Marathi", "Noto Serif Devanagari", Georgia, serif;
  --font-body: "Mukta", "Noto Sans Devanagari", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1626; --grid: #1a2438; --surface: #172036; --fg: #e8edf8; --muted: #9aa7c2;
    --line: #2b3855; --brand: #7c9bf0; --brand-fg: #0c1428; --brand-soft: #1f2d52;
    --mark: #f5b840; --mark-soft: #3a2f12; --danger: #f2837c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1626; --grid: #1a2438; --surface: #172036; --fg: #e8edf8; --muted: #9aa7c2;
  --line: #2b3855; --brand: #7c9bf0; --brand-fg: #0c1428; --brand-soft: #1f2d52;
  --mark: #f5b840; --mark-soft: #3a2f12; --danger: #f2837c; color-scheme: dark;
}
:root { --good: #1d7a46; --good-soft: #def3e6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --good: #6fd49a; --good-soft: #12301f; } }
:root[data-theme="dark"] { --good: #6fd49a; --good-soft: #12301f; }
* { box-sizing: border-box; }
body {
  margin: 0;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--fg);
  font: 16px/1.55 var(--font-body);
}
.wrap { max-width: 720px; margin: 0 auto; }
header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0 8px; }
.logo { font: 400 28px/1 var(--font-display); color: var(--brand); letter-spacing: .01em; }
.logo small { display: block; font: 500 12px/1.4 var(--font-body); color: var(--muted); letter-spacing: .08em; margin-top: 4px; }
.right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: var(--brand-fg); display: grid; place-items: center; font-weight: 700; flex: none; }
.who span.name { overflow-wrap: anywhere; }

.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; color: var(--fg); font: 700 14px var(--font-body); padding: 7px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--mark); color: #1b1303; }

.demo-note { background: var(--mark-soft); border-left: 4px solid var(--mark); padding: 10px 14px; margin: 10px 0 18px; font-size: 14.5px; border-radius: 0 6px 6px 0; }
.demo-note b { font-weight: 700; }
.welcome { background: var(--brand-soft); border-radius: 12px; padding: 14px 16px; margin: 6px 0 18px; }
.welcome h2 { margin: 0 0 6px; font-size: 18px; }
.welcome p { margin: 0 0 6px; font-size: 15px; line-height: 1.55; }
.welcome ul { margin: 6px 0 0; padding-left: 20px; font-size: 14.5px; line-height: 1.6; }
.byline { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; text-align: center; margin: 0 0 14px; padding: 10px 14px; border-radius: 12px; background: linear-gradient(135deg, var(--brand), #5a3fb0); color: #fff; box-shadow: 0 2px 10px rgba(35,75,176,.25); }
.byline .by { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.byline .names { font-family: 'Tiro Devanagari Marathi', serif; font-size: 19px; font-weight: 700; line-height: 1.3; }
.byline .amp { color: #ffd76a; padding: 0 4px; }
.wish { margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: var(--mark-soft); border-left: 4px solid var(--mark); font-size: 15px; font-weight: 600; line-height: 1.55; }
.authors { margin: 30px 0 12px; padding-top: 14px; border-top: 1.5px solid var(--line); text-align: center; font-size: 14.5px; color: var(--muted); }
.authors b { color: inherit; font-weight: 700; }

.switch { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); margin-bottom: 18px; flex-wrap: wrap; }
.switch button { border: 0; background: transparent; color: var(--fg); font: 500 15px var(--font-body); padding: 9px 16px; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); }

button, .btn { font: 700 15px var(--font-body); background: var(--brand); color: var(--brand-fg); border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
button:hover, .btn:hover { filter: brightness(1.08); }
button.del { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
:is(button, a, input, select, textarea):focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }

.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 26px; }
.panel h2 { font: 400 22px/1.3 var(--font-display); margin: 0 0 4px; text-wrap: balance; }
.panel p.sub { margin: 0 0 12px; color: var(--muted); font-size: 14.5px; }
form .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
label { display: block; font-size: 13.5px; font-weight: 500; color: var(--muted); margin: 12px 0 4px; }
input, select, textarea { width: 100%; font: 16px var(--font-body); color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.check { display: flex; gap: 8px; align-items: center; color: var(--fg); font-size: 15px; }
.check input { width: auto; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
#msg { font-size: 14.5px; color: var(--brand); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); padding: 7px 14px; border-radius: 999px; font: 500 15px var(--font-body); }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
.chaps-h { font-size: 13.5px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin: 4px 0 8px; }
.chaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 8px; margin-bottom: 18px; }
.chap { display: flex; gap: 10px; align-items: baseline; text-align: left; background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 500 14.5px/1.35 var(--font-body); min-width: 0; }
.chap b { color: var(--brand); font-variant-numeric: tabular-nums; min-width: 1.6em; }
.chap[aria-pressed="true"] { background: var(--mark-soft); border-color: var(--mark); }
.switch + .switch { margin-left: 8px; }
button.ghost { background: var(--brand-soft); color: var(--brand); }
.card.single { grid-template-columns: minmax(0, 1fr); }
.qb { border: 1.5px dashed var(--line); border-radius: 8px; padding: 4px 14px 12px; margin-top: 14px; }
.qb-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.qb-head label { margin: 10px 0 4px; }
.opt { display: flex; gap: 8px; align-items: center; margin: 6px 0; color: var(--fg); font-size: 15px; }
.opt input[type="radio"] { width: auto; padding: 0; flex: none; }
.opt .letter { font-weight: 700; color: var(--brand); flex: none; }
.opt > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.q { border: 1.5px solid var(--line); border-radius: 8px; margin: 0 0 12px; padding: 8px 14px 10px; min-width: 0; }
.q legend { font-weight: 700; padding: 0 6px; }
.q.ok { border-color: var(--good); background: var(--good-soft); }
.q.no { border-color: var(--danger); }
.opt.is-ok { color: var(--good); font-weight: 700; }
.opt.is-bad { color: var(--danger); text-decoration: line-through; }
.timer { font-weight: 700; background: var(--mark-soft); border-radius: 6px; padding: 6px 12px; display: inline-block; margin: 8px 0 14px; font-variant-numeric: tabular-nums; }
.score { font: 400 30px/1.2 var(--font-display); color: var(--brand); margin: 8px 0 16px; }
.notes { white-space: pre-wrap; margin: 8px 0 0; }
.mphoto { display: block; max-width: 100%; border-radius: 8px; border: 1.5px solid var(--line); margin-top: 10px; }
#secTests, #secStudy, #secClasses { margin-bottom: 30px; }
h2.list-h { font: 400 24px/1.3 var(--font-display); margin: 6px 0 12px; }
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 16px; }
.when { text-align: center; border-right: 1.5px dashed var(--line); padding-right: 14px; align-self: start; }
.when .d { font: 400 34px/1 var(--font-display); color: var(--brand); }
.when .m { font-size: 13px; color: var(--muted); }
.when .t { margin-top: 8px; font-weight: 700; font-size: 14px; background: var(--mark-soft); border-radius: 5px; padding: 2px 4px; }
.card h3 { margin: 0; font-size: 19px; line-height: 1.35; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.tag { font-size: 12.5px; font-weight: 500; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 2px 10px; }
.card p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.card .actions { margin-top: 12px; }
.joinbox { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.codein { width: 8.5em; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: transparent; color: inherit; font: inherit; }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 10px; }
.foot { margin-top: 28px; font-size: 13.5px; color: var(--muted); }
@media (max-width: 520px) {
  form .grid { grid-template-columns: minmax(0, 1fr); }
  .card { grid-template-columns: minmax(0, 1fr); }
  .when { display: flex; gap: 10px; align-items: baseline; border-right: 0; border-bottom: 1.5px dashed var(--line); padding: 0 0 8px; text-align: left; }
  .when .t { margin-top: 0; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s; } .card:hover { transform: translateY(-2px); } }
</style>

<div class="wrap">
  <div class="byline" role="note"><span class="by" data-i18n="authorsL"></span><span class="names"><span data-i18n="a1"></span><span class="amp">&amp;</span><span data-i18n="a2"></span></span></div>
  <header class="top">
    <div class="logo"><span data-i18n="brand"></span><small data-i18n="tagline"></small></div>
    <div class="right">
      <div class="lang" role="group" aria-label="Language / भाषा">
        <button type="button" id="lMr" aria-pressed="true">मराठी</button>
        <button type="button" id="lEn" aria-pressed="false">English</button>
      </div>
      <div class="who" id="who"></div>
    </div>
  </header>

  <section class="welcome" aria-labelledby="welH">
    <h2 id="welH" data-i18n="welcomeH"></h2>
    <p data-i18n="welcomeP"></p>
    <ul><li data-i18n="tip1"></li><li data-i18n="tip2"></li><li data-i18n="tip3"></li></ul>
    <p class="wish" data-i18n="wish"></p>

  <div class="demo-note" data-i18n-html="demo"></div>

  <div class="switch" role="group">

    <button type="button" id="vTeacher" aria-pressed="false" data-i18n="asTeacher"></button>

  <div class="chips" id="chips" role="group" aria-label="इयत्ता / Class"></div>

  <div id="secTests">

        <input id="t-title" required>
        <div class="grid">
          <div><label for="t-std" data-i18n="fStd"></label>

          <button type="submit" data-i18n="createTest"></button>
          <span id="tmsg" role="status" style="font-size:14.5px;color:var(--brand)"></span>
        </div>
      </form>
    </section>
    <h2 class="list-h" id="testsHead" data-i18n="testsH"></h2>
    <div class="cards" id="testList"></div>
    <section class="panel" id="runner" hidden></section>
  </div>

  <div id="secStudy">
    <section class="panel" id="studyPanel" hidden>
      <h2 data-i18n="studyFormTitle"></h2>
      <p class="sub" data-i18n="studyFormSub"></p>
      <form id="studyForm">
        <label for="m-title" data-i18n="mTitle"></label>
        <input id="m-title" required>
        <div class="grid">
          <div><label for="m-std" data-i18n="fStd"></label>
            <select id="m-std"><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div>
          <div><label for="m-chap" data-i18n="fTopic"></label><select id="m-chap"></select></div>
        </div>
        <label for="m-notes" data-i18n="mNotes"></label>
        <textarea id="m-notes" rows="4"></textarea>
        <label for="m-link" data-i18n="mLink"></label>
        <input id="m-link" type="url" placeholder="https://...">
        <label for="m-photo" data-i18n="mPhoto"></label>
        <input id="m-photo" type="file" accept="image/*">
        <div class="actions">
          <button type="submit" data-i18n="addMaterial"></button>
          <span id="smsg" role="status" style="font-size:14.5px;color:var(--brand)"></span>
        </div>
      </form>
    </section>
    <h2 class="list-h" data-i18n="studyH"></h2>
    <div class="cards" id="studyList"></div>
  </div>

  <div id="secClasses">
  <section class="panel" id="teacherPanel" hidden>
    <h2 data-i18n="formTitle"></h2>
    <p class="sub" data-i18n="formSub"></p>
    <form id="classForm">
      <label for="f-title" data-i18n="fTitle"></label>
      <input id="f-title" name="title" required data-i18n-ph="phTitle">
      <div class="grid">
        <div><label for="f-std" data-i18n="fStd"></label>
          <select id="f-std" name="standard"><option value="" data-i18n="choose"></option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div>
        <div><label for="f-topic" data-i18n="fTopic"></label><input id="f-topic" name="topic" data-i18n-ph="phTopic"><select id="f-chap" name="chapter" hidden></select></div>
        <div><label for="f-date" data-i18n="fDate"></label><input id="f-date" type="date" name="date" required></div>
        <div><label for="f-time" data-i18n="fTime"></label><input id="f-time" type="time" name="time" required value="18:00"></div>
        <div><label for="f-dur" data-i18n="fDur"></label><input id="f-dur" type="number" name="dur" value="60" min="15" max="300"></div>
        <div><label for="f-link" data-i18n="fLink"></label><input id="f-link" type="url" name="link" placeholder="https://meet.google.com/..."></div>
      </div>
      <label for="f-desc" data-i18n="fDesc"></label>
      <textarea id="f-desc" name="desc" rows="3"></textarea>
      <label class="check"><input id="f-meet" type="checkbox" name="meet"> <span data-i18n="fMeet"></span></label>
      <div class="actions">
        <button type="submit" data-i18n="create"></button>
        <span id="msg" role="status"></span>
      </div>
    </form>
  </section>

  <h2 class="list-h" data-i18n="upcoming"></h2>
  <div class="cards" id="list"></div>
  </div>

  <p class="foot" data-i18n="istNote"></p>
  <footer class="authors"><span data-i18n="authorsL"></span> <b data-i18n="authorsN"></b></footer>
</div>

  function mediumTag(m) {
    return m.medium === 'en' ? '<span class="tag">' + esc(t('mediumEn')) + '</span>'
         : m.medium === 'mr' ? '<span class="tag">' + esc(t('mediumMr')) + '</span>' : '';
  }

  function renderMaterials() {
    var list = materials.filter(function (m) {
      if (filter !== 'all' && String(m.std) !== filter) return false;
      if (m.medium && m.medium !== lang) return false;
      if (PARTS[filter] && m.part && String(m.part) !== partFilter) return false;     // two-part classes: only the chosen part's book           // each medium shows only its own book
      if (m.auto && chapFilter === null) return false;          // chapter notes show once a chapter is picked
      return chapFilter === null || m.ch === undefined || m.ch === chapFilter;   // whole-book items always show
    });
    if (!list.length) { $('#studyList').innerHTML = '<div class="empty">' + esc(t('noStudy')) + '</div>'; return; }
    // Show the book in the chosen language first, then items with no medium, then the other medium.
    var rank = function (m) { return m.medium === lang ? 0 : (m.medium ? 2 : 1); };
    list.sort(function (a, b) { return rank(a) - rank(b); });
    $('#studyList').innerHTML = list.map(function (m) {
      return '<article class="card single"><div><h3>' + esc(txt(m.title)) + '</h3><div class="tags">' +
        '<span class="tag">' + esc(t('std')(m.std)) + '</span>' + mediumTag(m) + chapterTag(m) +
        (m.example ? '<span class="tag">' + esc(t('exampleTag')) + '</span>' : '') + '</div>' +
        (m.notes ? '<p class="notes">' + esc(txt(m.notes)) + '</p>' : '') +
        (m.photo ? '<img class="mphoto" alt="" src="' + esc(m.photo) + '">' : '') +
        '<div class="actions">' +
        (m.link ? '<a class="btn" href="' + esc(m.link) + '" target="_blank" rel="noopener noreferrer">' + esc(t('openLink')) + '</a>' : '') +
        (role === 'teacher' ? '<button type="button" class="del" data-mdel="' + m.id + '">' + esc(t('del')) + '</button>' : '') +
        '</div></div></article>';
    }).join('');
  }

  function renderWho() {
    $('#who').innerHTML = role === 'teacher'
      ? '<div class="avatar">1</div><span class="name">1molharne@gmail.com <small style="color:var(--muted)">(' + esc(t('teacher')) + ')</small></span>'
      : '<a class="btn" href="#" id="signin">' + esc(t('signin')) + '</a>';
    var s = $('#signin');
    if (s) s.addEventListener('click', function (e) { e.preventDefault(); alert(lang === 'mr' ? 'हे फक्त नमुना पूर्वावलोकन आहे; येथे खरे Google साइन-इन चालत नाही. ते तुमच्या Replit साइटवर चालेल (SETUP.txt पाहा).' : 'This is only a preview, so real Google sign-in cannot run here. It runs on your Replit site once the Google keys are added (see SETUP.txt).'); });
  }

  var joined = false;   // demo only: the real site checks the code on the server after Google sign-in
  document.addEventListener('click', function (e) {
    var jb = e.target.closest && e.target.closest('[data-join]'); if (!jb) return;
    if (jb.parentNode.querySelector('.codein').value.trim() === '0770') { joined = true; renderList(); } else { alert(t('badCode')); }
  });

  function renderList() {
    var dayFmt = new Intl.DateTimeFormat(loc(), { day: 'numeric', timeZone: 'Asia/Kolkata' });
    var monFmt = new Intl.DateTimeFormat(loc(), { month: 'long', weekday: 'long', timeZone: 'Asia/Kolkata' });
    var timeFmt = new Intl.DateTimeFormat(loc(), { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Kolkata' });
    var list = classes
      .filter(function (c) { return filter === 'all' || String(c.std) === filter; })
      .filter(function (c) { return chapFilter === null || c.ch === chapFilter; })
      .sort(function (a, b) { return a.start - b.start; });
    if (!list.length) { $('#list').innerHTML = '<div class="empty">' + esc(t('none')) + '</div>'; return; }
    $('#list').innerHTML = list.map(function (c) {
      return '<article class="card">' +
        '<div class="when"><div class="d">' + esc(dayFmt.format(c.start)) + '</div><div class="m">' + esc(monFmt.format(c.start)) + '</div><div class="t">' + esc(timeFmt.format(c.start)) + '</div></div>' +
        '<div><h3>' + esc(txt(c.title)) + '</h3>' +
        '<div class="tags">' + (c.std ? '<span class="tag">' + esc(t('std')(c.std)) + '</span>' : '') +
        (c.topic ? '<span class="tag">' + esc(txt(c.topic)) + '</span>' : '') +
        '<span class="tag">' + esc(t('min')(c.dur)) + '</span></div>' +
        (c.desc ? '<p>' + esc(txt(c.desc)) + '</p>' : '') +
        '<div class="actions">' + ((role === 'teacher' || joined)
          ? '<a class="btn" href="' + esc(c.link) + '" target="_blank" rel="noopener noreferrer">' + esc(t('join')) + '</a>'
          : '<span class="joinbox"><input class="codein" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="' + esc(t('joinCode')) + '" aria-label="' + esc(t('joinCode')) + '"> <button type="button" class="btn" data-join>' + esc(t('join')) + '</button></span>') +
        (role === 'teacher' ? '<button type="button" class="del" data-del="' + c.id + '">' + esc(t('del')) + '</button>' : '') +
        '</div></div></article>';
    }).join('');
  }

  function renderAll() {
    applyStatic(); renderWho(); renderChips(); renderChaps(); renderList();
    renderTests(); renderMaterials();
    fillChapSelect('t-std', 't-chap'); fillChapSelect('m-std', 'm-chap');
    if (running) renderRunner();
  }

  function setRole(r) {
    role = r;
    $('#vStudent').setAttribute('aria-pressed', r === 'student');
    $('#vTeacher').setAttribute('aria-pressed', r === 'teacher');
    $('#teacherPanel').hidden = r !== 'teacher';
    closeRunner();
    $('#studyPanel').hidden = r !== 'teacher';
    renderTests(); renderMaterials();
    renderWho(); renderList();
  }

  function setLang(l) {
    lang = l;
    try { localStorage.setItem('gs-lang', l); } catch (e) {}
    renderAll();
  }

  $('#f-std').addEventListener('change', function () { $('#f-chap').value = ''; fillChapters(); });
  $('#chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]');
    if (!b) return;
    filter = b.getAttribute('data-f'); chapFilter = null; partFilter = '1';
    closeRunner();
    renderChips(); renderChaps(); renderList(); renderTests(); renderMaterials();
  });
  $('#chaps').addEventListener('click', function (e) {
    var b = e.target.closest('[data-c]');
    if (!b) return;
    var i = Number(b.getAttribute('data-c'));
    chapFilter = chapFilter === i ? null : i;
    closeRunner();
    renderChaps(); renderList(); renderTests(); renderMaterials();
  });

  $('#t-std').addEventListener('change', function () { $('#t-chap').value = ''; fillChapSelect('t-std', 't-chap'); });
  $('#m-std').addEventListener('change', function () { $('#m-chap').value = ''; fillChapSelect('m-std', 'm-chap'); });

  $('#addQ').addEventListener('click', addQuestion);
  $('#qBuilder').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rmq]');
    if (!b || $('#qBuilder').children.length < 2) return;
    b.closest('.qb').remove(); renumber();
  });

  $('#testList').addEventListener('click', function (e) {
    var s = e.target.closest('[data-start]'), d = e.target.closest('[data-tdel]');
    if (s) startTest(Number(s.getAttribute('data-start')));
    if (d) { var id = Number(d.getAttribute('data-tdel')); tests = tests.filter(function (y) { return y.id !== id; }); renderTests(); }
  });

  $('#runner').addEventListener('change', function (e) {
    var r = e.target;
    if (r.type === 'radio' && running && !running.done) running.answers[Number(r.name.slice(2))] = Number(r.value);
  });
  $('#runner').addEventListener('click', function (e) {
    if (e.target.id === 'submitTest') finishTest();
    if (e.target.id === 'backTest') closeRunner();
  });

  $('#testForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = $('#tmsg'), qs = [], ok = true;
    [].forEach.call($('#qBuilder').children, function (d) {
      var q = d.querySelector('.qb-q').value.trim();
      var opts = [].map.call(d.querySelectorAll('.qb-o'), function (o) { return o.value.trim(); });
      var a = d.querySelector('input[type="radio"]:checked');
      if (!q || opts.some(function (o) { return !o; })) ok = false;
      qs.push({ q: q, opts: opts, a: a ? Number(a.value) : 0 });
    });
    if (!qs.length || !ok) { msg.textContent = t('needQ'); return; }
    if (CHAPTERS[$('#t-std').value] && $('#t-chap').value === '') { msg.textContent = t('needChap'); return; }
    var std = $('#t-std').value, chs = $('#t-chap').value;
    tests.push({
      id: nextId++, title: $('#t-title').value.trim(), std: Number(std),
      ch: (CHAPTERS[std] && chs !== '') ? Number(chs) : undefined,
      dur: Math.min(Math.max(Number($('#t-dur').value) || 10, 1), 180), qs: qs
    });
    $('#t-title').value = ''; $('#qBuilder').innerHTML = ''; addQuestion();
    renderTests();
    msg.textContent = t('testAdded');
  });

  $('#studyList').addEventListener('click', function (e) {
    var d = e.target.closest('[data-mdel]');
    if (!d) return;
    var id = Number(d.getAttribute('data-mdel'));
    materials = materials.filter(function (m) { return m.id !== id; });
    renderMaterials();
  });

  $('#studyForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = $('#smsg'), title = $('#m-title').value.trim(), notes = $('#m-notes').value.trim(), link = $('#m-link').value.trim();
    var file = $('#m-photo').files[0], std = $('#m-std').value, chs = $('#m-chap').value;
    if (!title || (!notes && !link && !file) || (link && !/^https?:\/\//i.test(link))) { msg.textContent = t('needM'); return; }
    if (file && file.size > 5 * 1024 * 1024) { msg.textContent = t('bigPhoto'); return; }
    function save(photo) {
      materials.push({
        id: nextId++, title: title, std: Number(std), ch: (CHAPTERS[std] && chs !== '') ? Number(chs) : undefined,
        notes: notes, link: link, photo: photo
      });
      $('#studyForm').reset(); fillChapSelect('m-std', 'm-chap');
      renderMaterials(); msg.textContent = t('studyAdded');
    }
    if (file) {
      var r = new FileReader();
      r.onload = function () { save(String(r.result)); };
      r.onerror = function () { msg.textContent = t('needM'); };
      r.readAsDataURL(file);
    } else save('');
  });

  $('#parts').addEventListener('click', function (e) {
    var b = e.target.closest('[data-p]'); if (!b) return;
    partFilter = b.getAttribute('data-p'); chapFilter = null; closeRunner(); renderChaps(); renderList(); renderTests(); renderMaterials();
  });

  $('#lMr').addEventListener('click', function () { setLang('mr'); });
  $('#lEn').addEventListener('click', function () { setLang('en'); });
  $('#vStudent').addEventListener('click', function () { setRole('student'); });
  $('#vTeacher').addEventListener('click', function () { setRole('teacher'); });

  $('#list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-del]');
    if (!b) return;
    var id = Number(b.getAttribute('data-del'));
    classes = classes.filter(function (c) { return c.id !== id; });
    renderList();
  });

  $('#classForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, msg = $('#msg');
    var start = new Date(f.date.value + 'T' + f.time.value + ':00+05:30');
    if (isNaN(start)) { msg.textContent = t('badDate'); return; }
    var link = f.link.value.trim();
    if (f.meet.checked) link = 'https://meet.google.com/';
    if (!link) { msg.textContent = t('needLink'); return; }
    classes.push({
      id: nextId++, title: f.title.value.trim(), std: f.standard.value, topic: pickTopic(f), ch: (CHAPTERS[f.standard.value] && f.chapter.value !== '') ? Number(f.chapter.value) : undefined,
      desc: f.desc.value.trim(), start: start, dur: Number(f.dur.value) || 60, link: link
    });
    renderList();
    f.reset(); f.time.value = '18:00'; f.dur.value = 60; fillChapters();
    msg.textContent = t('added');
  });

  var d = new Date(); d.setDate(d.getDate() + 1);
  $('#f-date').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  addQuestion();
  renderAll();
  setRole('student');
})();
</script>

</body></html>
